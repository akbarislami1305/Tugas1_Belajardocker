events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format log dengan informasi upstream
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # 1. Gzip compression (aktif untuk JSON)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 50;
    gzip_types application/json text/plain text/css application/javascript application/xml;

    # 2. Rate Limiting (zona 10m, rate 3 request per detik)
    # Menolak permintaan berlebih dengan status HTTP 429
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=3r/s;
    limit_req_status 429;

    # 3. Load Balancing Upstream dengan Shared Memory Zone
    upstream backend_servers {
        zone backend_zone 64k;
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # 4. Header Keamanan
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 5. Header X-Upstream membawa alamat replica backend yang melayani
        add_header X-Upstream $upstream_addr always;

        # Reverse Proxy: location /api/ diteruskan ke backend
        # Lengkap dengan proxy_set_header Host dan X-Forwarded-For
        location /api/ {
            limit_req zone=api_limit burst=2 nodelay;

            proxy_pass http://backend_servers/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dokumentasi Swagger dan root fallback
        location = / {
            proxy_pass http://backend_servers/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api-docs {
            proxy_pass http://backend_servers/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api-docs.json {
            proxy_pass http://backend_servers/api-docs.json;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

