services:
  # ==========================================
  # Service Database (PostgreSQL) - Tanpa Ports Publik
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: pojok_teduh_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-pojok_teduh_db}
    volumes:
      # Volume untuk persistensi data database
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pojok_teduh_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pojok_teduh_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Service Backend (Express TypeScript API)
  # 3 Replicas - Tanpa Ports Publik
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    deploy:
      replicas: 3
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-pojok_teduh_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-pojok_teduh_secret_key_2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pojok_teduh_network

  # ==========================================
  # Service Nginx (Satu-satunya Pintu Masuk / Reverse Proxy)
  # Hanya service ini yang mengekspos ports ke host
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: pojok_teduh_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - pojok_teduh_network

# Volume persistent untuk data PostgreSQL
volumes:
  postgres_data:
    name: pojok_teduh_postgres_data

# Jaringan terisolasi untuk komunikasi antar-service
networks:
  pojok_teduh_network:
    name: pojok_teduh_network
    driver: bridge
